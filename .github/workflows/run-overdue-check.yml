name: Run overdue check

# Replaces the old always-on Celery worker: instead of a machine sitting up
# 24/7 polling Redis for a beat schedule, this hits the app's own
# /internal/run-overdue-check endpoint on a schedule. The check itself is a
# single cheap query, so this triggers it, not runs it.
#
# This is the BACKUP trigger. The primary is an external scheduler
# (cron-job.org) POSTing to the same endpoint every 15 minutes, because
# GitHub's schedule is best-effort and on this quiet repo it only fired every
# few hours. The check is idempotent, so both running is harmless.
#
# 15 minutes, not 1: a slower cadence lets the Fly web machine auto-stop
# between runs and lets the Neon database suspend, which is what keeps the
# monthly bill under Fly's $5 waiver. Detection lag is ~15-30 minutes worst
# case — a deliberate cost/responsiveness trade-off, not an oversight.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: POST /internal/run-overdue-check
        run: |
          code=$(curl -s -o /tmp/response.json -w '%{http_code}' -X POST \
            https://pulsecheck-shivam.fly.dev/internal/run-overdue-check \
            -H "X-Internal-Token: ${{ secrets.PULSECHECK_INTERNAL_TOKEN }}")
          echo "HTTP $code"
          cat /tmp/response.json
          echo ""
          if [ "$code" != "200" ]; then
            exit 1
          fi
